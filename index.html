<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>$ELP</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #000;
  color: white;
}

.hero {
  height: 100vh;
  background: url('hero-bg.png') center/cover no-repeat;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.hero h1 {
  font-size: 3rem;
  letter-spacing: 2px;
}

.hero p {
  color: #ff3b3b;
  margin-top: 10px;
}

.btn {
  margin-top: 20px;
  padding: 15px 40px;
  border: 1px solid red;
  color: red;
  text-decoration: none;
  transition: 0.3s;
}

.btn:hover {
  background: red;
  color: black;
}

.nav {
  position: fixed;
  top: 0;
  width: 100%;
  display: flex;
  justify-content: space-between;
  padding: 20px;
}

.nav img {
  width: 40px;
}

.section {
  padding: 80px 20px;
  text-align: center;
}

</style>
</head>

<body>

<div class="nav">
  <img src="logo.png">
</div>

<div class="hero">
  <h1>$ELP</h1>
  <p>You are the exit liquidity.</p>
  <a class="btn" href="#">BUY $ELP</a>
</div>

<div class="section">
  <h2>It never is.</h2>
</div>

</body>
</html>
