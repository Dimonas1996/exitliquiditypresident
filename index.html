<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHANCE</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #000;
  color: #fff;
  text-align: center;
}

/* LOGO */
.logo {
  margin-top: 40px;
}

#dice {
  width: 120px;
  transition: transform 0.8s ease;
}

/* HERO */
.hero h1 {
  font-size: 36px;
  margin-top: 20px;
}

.hero p {
  color: #aaa;
}

/* BUTTONS */
.roll-btn, .buy-btn {
  margin-top: 20px;
  padding: 15px 30px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

.roll-btn {
  background: #ffd600;
  color: #000;
}

.buy-btn {
  background: #fff;
  color: #000;
}

/* RESULT */
.result {
  margin-top: 20px;
  font-size: 26px;
  font-weight: bold;
}

/* LIVE FEED */
.live {
  margin-top: 40px;
  font-size: 14px;
  color: #aaa;
}
</style>
</head>

<body>

<div class="logo">
  <img id="dice" src="logo.png">
</div>

<div class="hero">
  <h1>EVERY BUY IS A ROLL</h1>
  <p>You either win... or you don’t.</p>
</div>

<button class="roll-btn" onclick="roll()">ROLL 🎲</button>

<div class="result" id="result"></div>

<br>

<a href="https://pump.fun" target="_blank">
  <button class="buy-btn">BUY NOW</button>
</a>

<div class="live" id="live">
</div>

<script>
function roll() {
  const dice = document.getElementById("dice");
  const resultDiv = document.getElementById("result");

  // random rotation
  const randomRotate = Math.floor(Math.random() * 1000) + 720;
  dice.style.transform = "rotate(" + randomRotate + "deg)";

  resultDiv.innerText = "ROLLING...";

  setTimeout(() => {
    const outcomes = ["🟢 WON", "🔴 LOST", "🟡 AGAIN"];
    const result = outcomes[Math.floor(Math.random() * outcomes.length)];

    resultDiv.innerText = result;

    addLive(result);

  }, 1000);
}

// fake live feed
function addLive(result) {
  const live = document.getElementById("live");
  const wallet = "0x" + Math.random().toString(16).substr(2,6);
  const line = wallet + " → " + result;

  live.innerHTML = line + "<br>" + live.innerHTML;
}
</script>

</body>
</html>
