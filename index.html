<!DOCTYPE html>
<html>
<head>
<style>
body {
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* LOGO /
.logo img {
  width:200px;
  border-radius:50%;
  box-shadow:0 0 20px red;
  transition:0.3s;
}

/ HOVER */
.logo img:hover {
  transform:scale(1.05);
  box-shadow:0 0 40px red;
}
</style>
</head>

<body>

<div class="logo">
  <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5f/Donald_Trump_official_portrait.jpg/480px-Donald_Trump_official_portrait.jpg">
</div>

</body>
</html>
