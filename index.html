<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>$ELP</title>

<style>
body {
  margin:0;
  background:black;
  color:white;
  font-family:Arial, sans-serif;
}

.wrapper {
  max-width:1200px;
  margin:auto;
}

/* LOGO /
.logo {
  text-align:center;
  padding:20px;
}

.logo img {
  width:120px;
}

/ HERO /
.hero {
  position:relative;
}

.hero img {
  width:100%;
}

.hero-text {
  position:absolute;
  top:50%;
  left:10%;
  transform:translateY(-50%);
}

.hero-text h1 {
  font-size:60px;
  font-weight:900;
  margin:0;
}

.red {
  color:#ff0000;
}

/ BUTTONS /
.buttons {
  margin-top:20px;
}

.btn {
  display:inline-block;
  padding:14px 30px;
  margin-right:10px;
  border-radius:10px;
  text-decoration:none;
  font-weight:bold;
}

.buy-btn {
  background:#ff0000;
  color:white;
  box-shadow:0 0 15px red;
}

.twitter-btn {
  border:2px solid #444;
  color:white;
}

/ MEMES /
.memes {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  padding:20px;
}

.memes img {
  width:100%;
  border-radius:10px;
}

/ FOOTER /
.footer {
  border-top:1px solid #222;
  margin-top:40px;
  padding:30px 20px;
  text-align:center;
}

.footer-logo {
  margin-bottom:10px;
}

.footer-logo img {
  width:80px;
}

.footer-text {
  font-size:14px;
  color:#aaa;
  margin:10px 0;
}

.footer-social a {
  margin:0 10px;
  color:white;
  text-decoration:none;
  font-size:14px;
}

.footer-social a:hover {
  color:red;
}

/ MOBILE */
@media(max-width:800px){
  .hero-text {
    position:static;
    transform:none;
    padding:20px;
  }

  .hero-text h1 {
    font-size:36px;
  }

  .memes {
    grid-template-columns:1fr 1fr;
  }
}
</style>

</head>

<body>

<div class="wrapper">

<!-- LOGO -->
<div class="logo">
  <img src="logo.png">
</div>

<!-- HERO -->
<div class="hero">
  <img src="hero.png">

  <div class="hero-text">
    <h1>
      YOU ARE THE <span class="red">EXIT LIQUIDITY</span>
    </h1>

    <div class="buttons">
      <a href="#" class="btn buy-btn">BUY $ELP</a>
      <a href="https://x.com/elpcoin?s=21" target="_blank" class="btn twitter-btn">TWITTER</a>
    </div>
  </div>
</div>

<!-- MEMES -->
<div class="memes">
  <img src="liquidity.png">
  <img src="final.png">
  <img src="community.png">
  <img src="pepe.png">
</div>

<!-- FOOTER -->
<div class="footer">

  <div class="footer-logo">
    <img src="logo.png">
  </div>

  <div class="footer-text">
    $ELP — Exit Liquidity President
  </div>

  <div class="footer-social">
    <a href="https://x.com/elpcoin?s=21" target="_blank">Twitter</a>
  </div>

  <div class="footer-text">
    © 2024 $ELP. All rights reserved.
  </div>

</div>

</div>

</body>
</html>
