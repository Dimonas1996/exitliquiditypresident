<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>$ELP</title>

<style>
body {
  margin:0;
  background:black;
  color:white;
  font-family:Arial, sans-serif;
}

/* WRAPPER /
.wrapper {
  max-width:1200px;
  margin:auto;
}

/ LOGO /
.logo {
  text-align:center;
  padding:20px;
}

.logo img {
  width:110px;
}

/ HERO /
.hero {
  position:relative;
}

.hero img {
  width:100%;
  display:block;
  filter:brightness(0.6);
}

/ HERO TEXT /
.hero-text {
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  text-align:center;
}

.hero-text h1 {
  font-size:70px;
  font-weight:900;
  margin:0;
  text-shadow:0 0 20px rgba(255,0,0,0.8);
}

.red {
  color:#ff0000;
}

/ BUTTONS /
.buttons {
  margin-top:25px;
}

.btn {
  display:inline-block;
  padding:16px 40px;
  margin:10px;
  border-radius:12px;
  text-decoration:none;
  font-weight:bold;
  font-size:18px;
  transition:0.3s;
}

/ BUY /
.buy-btn {
  background:#ff0000;
  color:white;
  box-shadow:0 0 20px red;
}

.buy-btn:hover {
  background:#cc0000;
  box-shadow:0 0 30px red;
}

/ TWITTER /
.twitter-btn {
  border:2px solid #555;
  color:white;
}

.twitter-btn:hover {
  border-color:#aaa;
}

/ MEMES /
.memes {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  padding:40px 20px;
}

.memes img {
  width:100%;
  border-radius:12px;
  transition:0.3s;
}

.memes img:hover {
  transform:scale(1.05);
}

/ FINAL CTA /
.final {
  text-align:center;
  padding:80px 20px;
}

.final h2 {
  font-size:50px;
  font-weight:900;
  margin:0;
  text-shadow:0 0 15px rgba(255,0,0,0.7);
}

/ MOBILE */
@media(max-width:800px){
  .hero-text h1 {
    font-size:36px;
  }

  .memes {
    grid-template-columns:1fr 1fr;
  }

  .final h2 {
    font-size:28px;
  }
}
</style>

</head>

<body>

<div class="wrapper">

<!-- LOGO -->
<div class="logo">
  <img src="logo.png">
</div>

<!-- HERO -->
<div class="hero">
  <img src="hero.png">

  <div class="hero-text">
    <h1>
      YOU ARE THE <span class="red">EXIT LIQUIDITY</span>
    </h1>

    <div class="buttons">
      <a href="#" class="btn buy-btn">BUY $ELP</a>
      <a href="https://x.com/elpcoin?s=21" target="_blank" class="btn twitter-btn">TWITTER</a>
    </div>
  </div>
</div>

<!-- MEMES -->
<div class="memes">
  <img src="liquidity.png">
  <img src="final.png">
  <img src="community.png">
  <img src="pepe.png">
</div>

<!-- FINAL -->
<div class="final">
  <h2>
    YOU ARE THE <span class="red">EXIT LIQUIDITY</span>
  </h2>
</div>

</div>

</body>
</html>
