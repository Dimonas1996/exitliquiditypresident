<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- GOOGLE FONT -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">

<title>$ELP</title>

<style>
body {
  margin:0;
  background:black;
  color:white;
  font-family:'Montserrat', sans-serif;
}

/* WRAPPER /
.wrapper {
  max-width:1200px;
  margin:auto;
  padding:0 20px;
}

/ LOGO /
.logo {
  text-align:center;
  padding:20px;
}

.logo img {
  width:110px;
}

/ HERO TEXT /
.hero-text h1 {
  font-family:'Orbitron', sans-serif;
  font-size:60px;
  font-weight:900;
  text-align:center;
  margin:20px 0;
  letter-spacing:2px;
}

.red {
  color:#ff0000;
}

/ BUTTONS /
.buttons {
  text-align:center;
  margin:20px 0 40px;
}

.btn {
  display:inline-block;
  padding:16px 40px;
  margin:10px;
  border-radius:12px;
  text-decoration:none;
  font-weight:700;
  font-size:18px;
}

/ BUY /
.buy-btn {
  background:#ff0000;
  color:white;
  box-shadow:0 0 20px red;
}

/ TWITTER /
.twitter-btn {
  border:2px solid #555;
  color:white;
}

/ SECTIONS /
.section {
  margin:60px 0;
}

/ HEADINGS /
.section h2 {
  font-family:'Orbitron', sans-serif;
  font-size:32px;
  letter-spacing:2px;
  margin-bottom:20px;
}

/ TEXT /
.section p {
  font-size:18px;
  color:#ccc;
  line-height:1.6;
}

/ TOKENOMICS /
.tokenomics {
  line-height:2;
}

/ MEMES /
.memes {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.memes img {
  width:100%;
  border-radius:12px;
}

/ MOBILE */
@media(max-width:800px){
  .hero-text h1 {
    font-size:32px;
  }

  .memes {
    grid-template-columns:1fr 1fr;
  }
}
</style>

</head>

<body>

<div class="wrapper">

<!-- LOGO -->
<div class="logo">
  <img src="logo.png">
</div>

<!-- HERO TEXT -->
<div class="hero-text">
  <h1>
    YOU ARE THE <span class="red">EXIT LIQUIDITY</span>
  </h1>
</div>

<!-- BUTTONS -->
<div class="buttons">
  <a href="#" class="btn buy-btn">BUY $ELP</a>
  <a href="https://x.com/elpcoin?s=21" target="_blank" class="btn twitter-btn">TWITTER</a>
</div>

<!-- ABOUT -->
<div class="section">
  <h2>ABOUT $ELP</h2>
  <p>
    This is not a project. This is a lesson.<br><br>
    They make the money.<br>
    You exit the liquidity.<br>
    Every single time.
  </p>
</div>

<!-- TOKENOMICS -->
<div class="section tokenomics">
  <h2>TOKENOMICS</h2>
  <p>
    Name: Exit Liquidity President<br>
    Symbol: $ELP<br>
    Supply: 1,000,000,000<br>
    Tax: 0%<br>
    Chain: Solana<br>
    Liquidity: Burned
  </p>
</div>

<!-- MEMES -->
<div class="section">
  <h2>MEMES</h2>

  <div class="memes">
    <img src="liquidity.png">
    <img src="final.png">
    <img src="community.png">
    <img src="pepe.png">
  </div>
</div>

</div>

</body>
</html>
