<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$SAD</title>

<style>
body{
  margin:0;
  background:black;
  color:white;
  font-family:Arial, sans-serif;

}

/* HERO */
.hero img{
  width:100%;
  display:block;
}

/* STORY */
.story{

}

.story p{
  color:#ccc;
  line-height:1.6;

  margin:auto;
}

.red{

.wallet{

  padding:15px;

  word-break:break-all;

}

/* BUTTON */
button{
  margin-top:15px;
  padding:12px 25px;
  border:1px solid #ff2b2b;

  cursor:pointer;
}

<body>

<!-- HERO -->
<div class="hero">

<!-- STORY -->
<div class="story">

<p>
I was chasing dreams.<br>
Financial freedom.<br><br>

No profit.<br>
No second chance.<br>
Just a lesson.

<h2 style="margin-top:40px;">SUPPORT THIS STORY</h2>

<div id="wallet" class="wallet">
BTtrAGY2sPV5BQDohLPq4ERBVP8TMjJ7T5iwwSWwaZ7H
</div>
