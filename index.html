<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>$ELP - Exit Liquidity President</title>

<style>
body {
  margin:0;
  background:black;
  color:white;
  font-family:Arial, sans-serif;
}

.wrapper {
  max-width:1200px;
  margin:auto;
}

/* LOGO /
.logo {
  text-align:center;
  padding:20px;
}

.logo img {
  width:120px;
}

/ HERO TEXT /
.hero-text {
  text-align:center;
  padding:20px;
}

.hero-text h1 {
  font-size:50px;
  margin:0;
}

.red {
  color:red;
}

/ BUTTONS /
.buttons {
  text-align:center;
  margin:20px;
}

.buttons a {
  display:inline-block;
  margin:10px;
  padding:15px 30px;
  background:red;
  color:white;
  text-decoration:none;
  border-radius:8px;
  font-weight:bold;
}

/ TOP GRID /
.top {
  display:grid;
  grid-template-columns: 2fr 1fr;
}

.top img {
  width:100%;
  display:block;
}

/ MEMES /
.memes {
  display:grid;
  grid-template-columns: repeat(4,1fr);
  gap:10px;
  padding:20px;
}

.memes img {
  width:100%;
  border-radius:10px;
}

/ BUY /
.buy {
  padding:20px;
}

.buy img {
  width:100%;
}

/ MOBILE */
@media(max-width:800px){
  .top {
    grid-template-columns:1fr;
  }

  .memes {
    grid-template-columns:1fr 1fr;
  }

  .hero-text h1 {
    font-size:32px;
  }
}
</style>

</head>

<body>

<div class="wrapper">

<div class="logo">
  <img src="logo.png">
</div>

<div class="hero-text">
  <h1>
    YOU ARE THE <span class="red">EXIT LIQUIDITY</span>
  </h1>
</div>

<div class="buttons">
  <a href="#">BUY $ELP</a>
  <a href="https://x.com/elpcoin?s=21" target="_blank">TWITTER</a>
</div>

<div class="top">
  <img src="hero.png">
  <div>
    <img src="tokenomics.png">
  </div>
</div>

<div class="memes">
  <img src="liquidity.png">
  <img src="final.png">
  <img src="community.png">
  <img src="pepe.png">
</div>

<div class="buy">
  <img src="buy.png">
</div>

</div>

</body>
</html>
