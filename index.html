<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>$ELP</title>

<!-- FAVICON -->
<link rel="icon" type="image/png" href="logo.png">

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Orbitron', sans-serif;
  background: #000;
  color: white;
}

/* NAV */
.nav {
  position: fixed;
  top: 0;
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 40px;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(10px);
  z-index: 1000;
}

.nav-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.nav-left img {
  width: 45px;
  border-radius: 50%;
}

.nav-left strong {
  color: red;
  font-size: 18px;
  text-shadow: 0 0 10px red;
}

.nav-right {
  display: flex;
  gap: 20px;
  align-items: center;
}

.nav a {
  color: white;
  text-decoration: none;
  font-size: 14px;
}

/* X ICON NAV */
.nav-icon {
  width: 18px;
  filter: drop-shadow(0 0 6px red);
  transition: 0.3s;
}

.nav-icon:hover {
  transform: scale(1.2);
}

/* BUY BUTTON */
.buy-btn {
  border: 1px solid red;
  padding: 10px 20px;
  color: red;

  box-shadow:
    0 0 5px red,
    0 0 10px red,
    inset 0 0 5px red;

  transition: 0.3s;
}

.buy-btn:hover {
  background: red;
  color: black;

  box-shadow:
    0 0 15px red,
    0 0 30px red;
}

/* HERO */
.hero {
  height: 100vh;
  background: url('hero-bg.png') center/cover no-repeat;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  position: relative;
}

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.7);
}

.hero * {
  position: relative;
  z-index: 2;
}

.hero h1 {
  font-size: 42px;
  letter-spacing: 2px;
  margin-bottom: 5px;
  font-weight: 600;
}

.hero span {
  color: red;
}

/* DIVIDER */
.divider {
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 8px 0;
  width: 60%;
}

.divider::before,
.divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: rgba(255,255,255,0.3);
}

.divider span {
  margin: 0 10px;
  color: red;
  text-shadow: 0 0 10px red;
}

/* MAIN BUTTON */
.cta {
  margin-top: 8px;
  padding: 15px 40px;
  border: 1px solid red;
  color: red;
  text-decoration: none;
  font-size: 18px;

  box-shadow:
    0 0 10px red,
    0 0 20px red,
    inset 0 0 10px red;

  animation: pulse 2s infinite;
  transition: 0.3s;
}

.cta:hover {
  background: red;
  color: black;

  box-shadow:
    0 0 20px red,
    0 0 40px red,
    0 0 80px red;
}

/* PULSE */
@keyframes pulse {
  0% { box-shadow: 0 0 10px red; }
  50% { box-shadow: 0 0 30px red; }
  100% { box-shadow: 0 0 10px red; }
}

/* BOXES */
.boxes {
  display: flex;
  justify-content: center;
  gap: 20px;
  padding: 40px;
}

.box {
  border: 1px solid rgba(255,255,255,0.1);
  padding: 20px;
  width: 260px;
  display: flex;
  align-items: center;
  gap: 15px;
  transition: 0.3s;
}

.box:hover {
  transform: translateY(-5px);
  border-color: red;
  box-shadow: 0 0 15px red;
}

.icon {
  width: 35px;
  filter: drop-shadow(0 0 6px red);
}

.box-title {
  color: red;
  font-size: 12px;
}

/* FOOTER */
.footer {
  text-align: center;
  padding: 20px;
  font-size: 12px;
  color: gray;
}
  @media (max-width: 768px) {

  .nav {
    padding: 15px 20px;
  }

  .nav-left strong {
    font-size: 14px;
  }

  .nav-icon {
    width: 22px;
  }

  .hero h1 {
    font-size: 26px;
    padding: 0 15px;
  }

  .divider {
    width: 80%;
  }

  .cta {
    padding: 12px 25px;
    font-size: 16px;
  }

  .boxes {
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }

  .box {
    width: 90%;
  }

}
</style>
</head>

<body>

<div class="nav">
  <div class="nav-left">
    <img src="logo.png">
    <strong>$ELP</strong>
  </div>

  <div class="nav-right">
    <a href="https://x.com/exitelpx?s=21">
      <img src="x.png" class="nav-icon">
    </a>
    <a href="#">Chart</a>
    <a class="buy-btn" href="#">BUY</a>
  </div>
</div>

<div class="hero">
  <h1>YOU ARE THE <span>EXIT LIQUIDITY</span></h1>

  <div class="divider">
    <span>★</span>
  </div>

  <a class="cta" href="#">BUY $ELP</a>
</div>

<div class="boxes">

  <div class="box">
    <img src="contract.png" class="icon">
    <div>
      <div class="box-title">CONTRACT</div>
      <div>0x000000000000000000000</div>
    </div>
  </div>

  <div class="box">
    <img src="x.png" class="icon">
    <div>
      <div class="box-title">TWITTER</div>
      <div>@ExitELPx</div>
    </div>
  </div>

  <div class="box">
    <img src="pump.png" class="icon">
    <div>
      <div class="box-title">PUMPFUN</div>
      <div>pump.fun/$ELP</div>
    </div>
  </div>

</div>

<div class="footer">
  $ELP • YOU ARE THE <span style="color:red;">EXIT LIQUIDITY</span>
</div>

</body>
</html>
