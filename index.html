<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$SAD</title>

<!-- FONTS -->
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:black;
  color:white;
  text-align:center;
}

/* HERO IMAGE */
.hero img{
  width:100%;
  display:block;
}

/* STORY */
.story{
  padding:50px 20px;
}

.story h2{
  font-family:'Bebas Neue', sans-serif;
  color:#ff2b2b;
  letter-spacing:2px;
  font-size:32px;
}

.story p{
  font-family:'Montserrat', sans-serif;
  color:#ccc;
  line-height:1.8;
  max-width:420px;
  margin:20px auto;
}

.red{
  color:#ff2b2b;
}

/* WALLET */
.wallet-title{
  margin-top:40px;
  font-family:'Bebas Neue';
  color:#ff2b2b;
}

.wallet{
  margin:20px auto;
  padding:15px;
  border:1px solid #ff2b2b;
  max-width:600px;
  word-break:break-all;
  font-family:'Montserrat';
}

/* BUTTON */
button{
  margin-top:20px;
  padding:14px 30px;
  border:1px solid #ff2b2b;
  background:none;
  color:white;
  font-family:'Montserrat';
  cursor:pointer;
}

/* BOTTOM TEXT */
.bottom-text{
  margin-top:25px;
  font-family:'Montserrat';
  color:#777;
  font-size:14px;
}

.bottom-text span{
  color:#ff2b2b;
}

/* MOBILE */
@media(max-width:768px){
  .story h2{font-size:26px;}
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
  <img src="hero-bg.jpg">
</div>

<!-- STORY -->
<div class="story">

<h2>THIS IS MY STORY</h2>

<p>
I was chasing dreams.<br>
Financial freedom.<br><br>

I found memecoins.<br>
Until it wasn’t.<br><br>

<span class="red">€68,000 gone.</span><br>
<span class="red">All my savings.</span><br><br>

No profit.<br>
No second chance.<br>
Just a lesson.
</p>

<h2 class="wallet-title">SUPPORT THIS STORY</h2>

<div id="wallet" class="wallet">
BTtrAGY2sPV5BQDohLPq4ERBVP8TMjJ7T5iwwSWwaZ7H
</div>

<button onclick="copyWallet()">❤️ DONATION</button>

<p class="bottom-text">
Every loss has a story.<br>
<span>$SAD is ours.</span>
</p>

</div>

<script>
function copyWallet(){
  navigator.clipboard.writeText(
    document.getElementById("wallet").innerText
  );
  alert("Wallet copied");
}
</script>

</body>
</html>
