<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$SAD</title>

<style>
body {
  margin:0;
  background:black;
  color:white;
  font-family:Arial, sans-serif;
}

/* HEADER */
.header {
  position:absolute;
  top:20px;
  left:20px;
}

.header img {
  height:50px;
}

/* HERO */
.hero {
  height:100vh;
  background:url('hero-bg.png') center/cover no-repeat;
  display:flex;
  align-items:center;
  padding-left:10%;
}

.hero-text {
  max-width:500px;
}

.hero h1 {
  font-size:60px;
  line-height:1.1;
}

.red {
  color:#ff2b2b;
}

.hero button {
  margin-top:20px;
  padding:15px 35px;
  border:1px solid #ff2b2b;
  background:transparent;
  color:white;
  cursor:pointer;
  font-size:16px;
}

/* STORY */
.story {
  display:flex;
  align-items:center;
  justify-content:center;
  padding:80px 10%;
  gap:50px;
}

.story img {
  width:350px;
}

.story-text {
  max-width:400px;
  font-size:16px;
  line-height:1.6;
}

/* WALLET */
.wallet-box {
  margin-top:20px;
  padding:15px;
  border:1px solid #333;
  font-size:14px;
  word-break:break-all;
}

/* MOBILE */
@media(max-width:768px){

.hero {
  padding:20px;
}

.hero h1 {
  font-size:30px;
}

.story {
  flex-direction:column;
  text-align:center;
}

.story img {
  width:200px;
}

}
</style>
</head>

<body>

<!-- LOGO -->
<div class="header">
  <img src="logo-header.png">
</div>

<!-- HERO -->
<div class="hero">
  <div class="hero-text">

    <h1>
      YOU SAW IT EARLY.<br>
      <span class="red">YOU MISSED IT.</span>
    </h1>

    <h2 class="red">$SAD</h2>

    <button onclick="copyWallet()">❤️ DONATION</button>

  </div>
</div>

<!-- STORY -->
<div class="story">

  <img src="story-image.png">

  <div class="story-text">

    <p>
    €68,000 gone.<br><br>
    All my savings.<br><br>
    This is my story.
    </p>

    <div id="wallet" class="wallet-box">
    BTtrAGY2sPV5BQDohLPq4ERBVP8TMjJ7T5iwwSWwaZ7H
    </div>

  </div>

</div>

<script>
function copyWallet(){
  const text = document.getElementById("wallet").innerText;
  navigator.clipboard.writeText(text);
  alert("Wallet copied");
}
</script>

</body>
</html>
