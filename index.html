<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

<title>$ELP</title>

<style>
body {
  margin:0;
  background:#000;
  color:#fff;
  font-family:'Inter', sans-serif;
}

/* WRAPPER /
.wrapper {
  max-width:900px;
  margin:auto;
  padding:20px;
  text-align:center;
}

/ LOGO /
.logo img {
  width:100px;
  margin-bottom:20px;
}

/ HERO /
.hero h1 {
  font-size:60px;
  font-weight:900;
  text-transform:uppercase;
  margin:0;
}

.hero span {
  color:#ff0000;
}

/ BUTTONS /
.buttons {
  margin-top:25px;
}

.btn {
  display:inline-block;
  padding:15px 35px;
  margin:8px;
  border-radius:10px;
  text-decoration:none;
  font-weight:700;
}

.buy-btn {
  background:#ff0000;
  color:#fff;
  box-shadow:0 0 20px red;
}

.twitter-btn {
  border:2px solid #444;
  color:#fff;
}

/ CARDS /
.card {
  background:#0a0a0a;
  border:1px solid rgba(255,0,0,0.5);
  border-radius:12px;
  padding:25px;
  margin:30px 0;
}

/ TITLES /
.card h2 {
  font-size:26px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:15px;
}

.card h2 span {
  color:#ff0000;
}

/ TEXT /
.card p {
  color:#ccc;
  font-size:16px;
  line-height:1.7;
}

/ IMAGES /
.image-box {
  border:2px solid rgba(255,0,0,0.6);
  border-radius:10px;
  padding:5px;
  margin:10px 0;
}

.image-box img {
  width:100%;
  border-radius:8px;
}

/ MEMES /
.memes {
  margin-top:40px;
}

/ FOOTER /
.footer {
  margin-top:50px;
  color:#555;
  font-size:14px;
}

/ MOBILE */
@media(max-width:800px){
  .hero h1 {
    font-size:30px;
  }
}
</style>

</head>

<body>

<div class="wrapper">

<!-- LOGO -->
<div class="logo">
  <img src="logo.png">
</div>

<!-- HERO -->
<div class="hero">
  <h1>
    YOU ARE THE <span>EXIT LIQUIDITY</span>
  </h1>

  <div class="buttons">
    <a href="#" class="btn buy-btn">BUY $ELP</a>
    <a href="https://x.com/elpcoin?s=21" target="_blank" class="btn twitter-btn">TWITTER</a>
  </div>
</div>

<!-- ABOUT -->
<div class="card">
  <h2>ABOUT <span>$ELP</span></h2>
  <p>
    This is not a project. This is a lesson.<br><br>
    They make the money.<br>
    You exit the liquidity.<br>
    Every single time.
  </p>
</div>

<!-- TOKENOMICS -->
<div class="card">
  <h2>TOKENOMICS</h2>
  <p>
    Name: Exit Liquidity President<br>
    Symbol: $ELP<br>
    Supply: 1,000,000,000<br>
    Tax: 0%<br>
    Chain: Solana<br>
    Liquidity: Burned
  </p>
</div>

<!-- MEMES -->
<div class="memes">
  <div class="image-box"><img src="liquidity.png"></div>
  <div class="image-box"><img src="final.png"></div>
  <div class="image-box"><img src="community.png"></div>
  <div class="image-box"><img src="pepe.png"></div>
</div>

<!-- BUY -->
<div class="image-box">
  <img src="buy.png">
</div>

<!-- FOOTER -->
<div class="footer">
  © 2024 $ELP
</div>

</div>

</body>
</html>
