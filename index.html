<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>$ELP</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #000;
  color: white;
}

/* NAV */
.nav {
  position: fixed;
  top: 0;
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 40px;
  background: rgba(0,0,0,0.7);
}

.nav-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.nav-left img {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  border: 1px solid rgba(255,0,0,0.5);
  box-shadow: 0 0 10px rgba(255,0,0,0.6);
  object-fit: cover;
}

.nav-left strong {
  color: red;
  font-size: 18px;
  text-shadow: 0 0 10px red;
}

.nav-right {
  display: flex;
  gap: 20px;
  align-items: center;
}

.nav a {
  color: white;
  text-decoration: none;
  font-size: 14px;
}

.buy-btn {
  border: 1px solid red;
  padding: 10px 20px;
  color: red;
}

/* HERO */
.hero {
  height: 100vh;
  background: url('hero-bg.png') center/cover no-repeat;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  position: relative;
}

/* Tamsinimas */
.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.65);
}

.hero * {
  position: relative;
  z-index: 2;
}

.hero h1 {
  font-size: 40px;
  letter-spacing: 2px;
  margin-bottom: 5px;
}

.hero span {
  color: red;
}

/* ⭐ DIVIDER */
.divider {
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 8px 0;
  width: 60%;
}

.divider::before,
.divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: rgba(255,255,255,0.25);
}

.divider span {
  margin: 0 10px;
  color: red;
  font-size: 14px;
  text-shadow: 0 0 8px red;
}

/* CTA */
.cta {
  margin-top: 8px;
  padding: 15px 40px;
  border: 1px solid red;
  color: red;
  text-decoration: none;
  font-size: 18px;
  box-shadow: 0 0 10px rgba(255,0,0,0.5);
}

/* BOXES */
.boxes {
  display: flex;
  justify-content: center;
  gap: 20px;
  padding: 40px;
}

.box {
  border: 1px solid rgba(255,255,255,0.1);
  padding: 20px;
  width: 260px;
  display: flex;
  align-items: center;
  gap: 15px;
  position: relative;
}

.box::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 1px;
  background: red;
  box-shadow: 0 0 8px red;
}

.icon {
  width: 35px;
  filter: drop-shadow(0 0 6px red);
}

.box-title {
  color: red;
  font-size: 12px;
}

/* FOOTER */
.footer {
  text-align: center;
  padding: 20px;
  font-size: 12px;
  color: gray;
}
</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
  <div class="nav-left">
    <img src="logo.png">
    <strong>$ELP</strong>
  </div>

  <div class="nav-right">
    <a href="https://x.com/exitelpx?s=21">X</a>
    <a href="#">Chart</a>
    <a class="buy-btn" href="#">BUY</a>
  </div>
</div>

<!-- HERO -->
<div class="hero">
  <h1>YOU ARE THE <span>EXIT LIQUIDITY</span></h1>

  <div class="divider">
    <span>★</span>
  </div>

  <a class="cta" href="#">BUY $ELP</a>
</div>

<!-- BOXES -->
<div class="boxes">

  <div class="box">
    <img src="contract.png" class="icon">
    <div>
      <div class="box-title">CONTRACT</div>
      <div>0x000000000000000000000</div>
    </div>
  </div>

  <div class="box">
    <img src="x.png" class="icon">
    <div>
      <div class="box-title">TWITTER</div>
      <div>@ExitELPx</div>
    </div>
  </div>

  <div class="box">
    <img src="pump.png" class="icon">
    <div>
      <div class="box-title">PUMPFUN</div>
      <div>pump.fun/$ELP</div>
    </div>
  </div>

</div>

<!-- FOOTER -->
<div class="footer">
  $ELP • YOU ARE THE <span style="color:red;">EXIT LIQUIDITY</span>
</div>

</body>
</html>
