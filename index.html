<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* LOGO /
.logo img {
  width:220px;
  border-radius:50%;
  box-shadow:0 0 20px red;
  transition:0.3s;
}

/ HOVER */
.logo img:hover {
  transform:scale(1.08);
  box-shadow:0 0 40px red;
}
</style>
</head>

<body>

<div class="logo">
  <img src="logo.png">
</div>

</body>
</html>
