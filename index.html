<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>$ELP</title>

<style>
body {
  margin:0;
  background:black;
  color:white;
  font-family:Arial, sans-serif;
  text-align:center;
}

/* WRAPPER /
.wrapper {
  max-width:1200px;
  margin:auto;
}

/ LOGO /
.logo {
  padding:30px 0 10px;
}

.logo img {
  width:110px;
}

/ HEADER TEXT /
.header-text {
  margin-bottom:20px;
}

.header-text h1 {
  font-size:56px;
  font-weight:900;
  margin:0;
}

.red {
  color:#ff0000;
}

/ BUTTONS /
.buttons {
  margin:20px 0 40px;
}

.btn {
  display:inline-block;
  padding:14px 35px;
  margin:5px;
  border-radius:10px;
  text-decoration:none;
  font-weight:bold;
  font-size:16px;
}

/ BUY /
.buy-btn {
  background:#ff0000;
  color:white;
  box-shadow:0 0 12px red;
}

/ TWITTER /
.twitter-btn {
  border:2px solid #444;
  color:white;
}

/ HERO IMAGE /
.hero img {
  width:100%;
}

/ MEMES /
.memes {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  padding:30px 20px;
}

.memes img {
  width:100%;
  border-radius:10px;
}

/ FOOTER TEXT /
.footer {
  padding:40px 20px;
  font-size:20px;
  font-weight:700;
  color:#ccc;
}

/ MOBILE */
@media(max-width:800px){
  .header-text h1 {
    font-size:32px;
  }

  .memes {
    grid-template-columns:1fr 1fr;
  }
}
</style>

</head>

<body>

<div class="wrapper">

<!-- LOGO -->
<div class="logo">
  <img src="logo.png">
</div>

<!-- HEADER -->
<div class="header-text">
  <h1>
    YOU ARE THE <span class="red">EXIT LIQUIDITY</span>
  </h1>
</div>

<!-- BUTTONS -->
<div class="buttons">
  <a href="#" class="btn buy-btn">BUY $ELP</a>
  <a href="https://x.com/elpcoin?s=21" target="_blank" class="btn twitter-btn">TWITTER</a>
</div>

<!-- HERO -->
<div class="hero">
  <img src="hero.png">
</div>

<!-- MEMES -->
<div class="memes">
  <img src="liquidity.png">
  <img src="final.png">
  <img src="community.png">
  <img src="pepe.png">
</div>

<!-- FOOTER -->
<div class="footer">
  YOU ARE THE EXIT LIQUIDITY
</div>

</div>

</body>
</html>
