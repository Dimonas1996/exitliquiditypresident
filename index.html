<!DOCTYPE html>
<html lang="en">
<head>

<title>$ELP</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #000;
  color: white;
}

/* NAV */
.nav {
  position: fixed;
  top: 0;
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 40px;
  background: rgba(0,0,0,0.7);
}

.nav-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.nav-left img {
  width: 45px;
  height: 42px;
  border-radius: 50%;

  border: 1px solid rgba(255,0,0,0.5);
  box-shadow: 0 0 10px rgba(255,0,0,0.6);

  object-fit: cover;
}

.nav-right {
  display: flex;
  gap: 20px;
  align-items: center;
}

.nav a {
  color: white;
  text-decoration: none;
  font-size: 14px;
}

.buy-btn {
  border: 1px solid red;
  padding: 10px 20px;
  color: red;
}

/* HERO */
.hero {
  height: 100vh;
  background: url('hero-bg.png') center/cover no-repeat;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.hero h1 {
  font-size: 40px;
}

.hero span {
  color: red;
}

.cta {
  margin-top: 20px;
  padding: 12px 30px;
  border: 1px solid red;
  color: red;
  text-decoration: none;
}

/* BOXES */
.boxes {
  display: flex;
  justify-content: center;
  gap: 20px;
  padding: 40px;
}

.box {
  border: 1px solid rgba(255,255,255,0.2);
  padding: 20px;
  width: 260px;

  display: flex;
  align-items: center;
  gap: 15px;
}

.icon {
  width: 35px;
  filter: drop-shadow(0 0 6px red);
}

.box-title {
  color: red;
  font-size: 12px;
}

.footer {
  text-align: center;
  padding: 20px;
  font-size: 12px;
  color: gray;
}
</style>
</head>

<body>

<div class="nav">
  <div class="nav-left">
  <img src="logo.png">
  <strong style="color:red; font-size:18px; text-shadow:0 0 10px red;">
    $ELP
  </strong>
</div>

  <div class="nav-right">
    <a href="https://x.com/exitelpx?s=21">X</a>
    <a href="#">Chart</a>
    <a class="buy-btn" href="#">BUY</a>
  </div>
</div>

<div class="hero">
  <h1>YOU ARE THE <span>EXIT LIQUIDITY</span></h1>
  <a class="cta" href="#">BUY $ELP</a>
</div>

<div class="boxes">

  <div class="box">
    <img src="contract.png" class="icon">
    <div>
      <div class="box-title">CONTRACT</div>
      <div>0x000000000000000000000</div>
    </div>
  </div>

  <div class="box">
    <img src="x.png" class="icon">
    <div>
      <div class="box-title">TWITTER</div>
      <div>@ExitELPx</div>
    </div>
  </div>

  <div class="box">
    <img src="pump.png" class="icon">
    <div>
      <div class="box-title">PUMPFUN</div>
      <div>pump.fun/$ELP</div>

</div>

<div class="footer">
  $ELP • YOU ARE THE <span style="color:red;">EXIT LIQUIDITY</span>
</div>

</body>
</html>
