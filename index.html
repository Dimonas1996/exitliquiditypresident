<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>$ELP - Exit Liquidity President</title>

<style>
body {
  margin:0;
  background:black;
  color:white;
  font-family:Arial, sans-serif;
}

.wrapper {
  max-width:1200px;
  margin:auto;
}

/* LOGO /
.logo {
  text-align:center;
  padding:20px;
}

.logo img {
  width:120px;
}

/ HERO TEXT /
.hero-text {
  text-align:center;
  padding:20px;
}

.hero-text h1 {
  font-size:64px;
  font-weight:900;
  margin:0;
}

.red {
  color:#ff0000;
}

/ BUTTONS /
.buttons {
  text-align:center;
  margin:30px 0;
}

.buttons a {
  display:inline-block;
  margin:10px;
  padding:16px 40px;
  text-decoration:none;
  border-radius:10px;
  font-weight:bold;
  font-size:18px;
  transition:0.3s;
}

/ BUY BUTTON /
.buy-btn {
  background:#ff0000;
  color:white;
}

.buy-btn:hover {
  background:#cc0000;
}

/ TWITTER BUTTON /
.twitter-btn {
  border:2px solid #555;
  color:white;
}

.twitter-btn:hover {
  background:#111;
  border-color:#999;
}

/ TOP /
.top {
  display:grid;
  grid-template-columns:2fr 1fr;
}

.top img {
  width:100%;
  display:block;
}

/ MEMES /
.memes {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  padding:30px 20px;
}

.memes img {
  width:100%;
  border-radius:12px;
}

/ BUY SECTION /
.buy {
  padding:30px 20px;
}

.buy img {
  width:100%;
}

/ MOBILE */
@media(max-width:800px){
  .top {
    grid-template-columns:1fr;
  }

  .memes {
    grid-template-columns:1fr 1fr;
  }

  .hero-text h1 {
    font-size:36px;
  }
}
</style>

</head>

<body>

<div class="wrapper">

<!-- LOGO -->
<div class="logo">
  <img src="logo.png">
</div>

<!-- HERO TEXT -->
<div class="hero-text">
  <h1>
    YOU ARE THE <span class="red">EXIT LIQUIDITY</span>
  </h1>
</div>

<!-- BUTTONS -->
<div class="buttons">

  <!-- 👇 ČIA ĮDĖSI SAVO PUMP LINKĄ -->
  <a href="PUT_YOUR_LINK_HERE" target="_blank" class="buy-btn">
    BUY $ELP
  </a>

  <a href="https://x.com/elpcoin?s=21" target="_blank" class="twitter-btn">
    TWITTER
  </a>

</div>

<!-- TOP -->
<div class="top">
  <img src="hero.png">
  <div>
    <img src="tokenomics.png">
  </div>
</div>

<!-- MEMES -->
<div class="memes">
  <img src="liquidity.png">
  <img src="final.png">
  <img src="community.png">
  <img src="pepe.png">
</div>

<!-- BUY IMAGE -->
<div class="buy">
  <img src="buy.png">
</div>

</div>

</body>
</html>
