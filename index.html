<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  background:black;
}

/* TOP */
.top {
  display:grid;
  grid-template-columns: 2fr 1fr;
}

.top img {
  width:100%;
  display:block;
}

/* MEMES */
.memes {
  display:grid;
  grid-template-columns: repeat(4,1fr);
  gap:10px;
  padding:20px;
}

.memes img {
  width:100%;
  border-radius:10px;
}

/* BUY */
.buy {
  display:grid;
  grid-template-columns:1fr 1fr;
}

.buy img {
  width:100%;
}

/* MOBILE */
@media(max-width:800px){
  .top {
    grid-template-columns:1fr;
  }

  .memes {
    grid-template-columns:1fr 1fr;
  }

  .buy {
    grid-template-columns:1fr;
  }
}
</style>

</head>

<body>

<!-- TOP -->
<div class="top">
  <img src="hero.png">

  <div>
    <img src="logo.png">
    <img src="tokenomics.png">
  </div>
</div>

<!-- MEMES -->
<div class="memes">
  <img src="liquidity.png">
  <img src="final.png">
  <img src="community.png">
  <img src="pepe.png">
</div>

<!-- BUY -->
<div class="buy">
  <img src="buy.png">
  <img src="buy.png">
</div>

</body>
</html>
