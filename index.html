<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$SAD</title>

<style>
body{
  margin:0;
  background:black;
  color:white;
  font-family:Arial, sans-serif;
}

/* LOGO */
.logo{
  position:absolute;
  top:20px;
  left:20px;
}
.logo img{
  height:50px;
}

/* HERO */
.hero{
  min-height:100vh;
  background:url('hero-bg.png') center/cover no-repeat;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  text-align:center;
}

.hero-content{
  max-width:500px;
}

.hero h1{
  font-size:42px;
  line-height:1.2;
}

.red{
  color:#ff2b2b;
}

.btn{
  margin-top:20px;
  padding:14px 30px;
  border:1px solid #ff2b2b;
  background:none;
  color:white;
  font-size:16px;
  cursor:pointer;
}

/* STORY */
.story{
  padding:40px 20px;
  text-align:center;
}

.story img{
  width:220px;
  margin-bottom:20px;
}

.wallet{
  margin-top:20px;
  padding:10px;
  border:1px solid #333;
  font-size:13px;
  word-break:break-all;
}

/* MOBILE */
@media(min-width:768px){

.hero{
  justify-content:flex-start;
  text-align:left;
  padding-left:10%;
}

.hero-content{
  max-width:450px;
}

.hero h1{
  font-size:60px;
}

.story{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:50px;
  text-align:left;
}

.story img{
  width:320px;
}

}
</style>
</head>

<body>

<!-- LOGO -->
<div class="logo">
  <img src="logo-header.png">
</div>

<!-- HERO -->
<div class="hero">
  <div class="hero-content">

    <h1>
      YOU SAW IT EARLY.<br>
      <span class="red">YOU MISSED IT.</span>
    </h1>

    <h2 class="red">$SAD</h2>

    <button class="btn" onclick="copyWallet()">❤️ DONATION</button>

  </div>
</div>

<!-- STORY -->
<div class="story">

  <img src="story-image.png">

  <div>
    <p>
      €68,000 gone.<br><br>
      All my savings.<br><br>
      This is my story.
    </p>

    <div id="wallet" class="wallet">
      BTtrAGY2sPV5BQDohLPq4ERBVP8TMjJ7T5iwwSWwaZ7H
    </div>
  </div>

</div>

<script>
function copyWallet(){
  navigator.clipboard.writeText(
    document.getElementById("wallet").innerText
  );
  alert("Wallet copied");
}
</script>

</body>
</html>
